name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build the full brook of binaries with both GCC and Clang.
  # ---------------------------------------------------------------------------
  build:
    name: build (CC=${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libncurses-dev \
                                  libglib2.0-dev zlib1g-dev

      - name: Build atop and helper binaries
        run: make CC=${{ matrix.cc }} -j$(nproc)

      - name: Smoke test (atop -V)
        run: ./atop -V
